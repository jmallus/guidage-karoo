<!doctype html>
<html>

<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: "Roboto Condensed", system-ui, sans-serif; }
    a { color: #2E8BFF; } a:hover { color: #79B4FF; }
  </style>
</helmet>
<div style="position: relative; width: 234px; height: 334px; background: #000000; overflow: hidden">
  <svg width="234" height="334" viewBox="0 0 234 334" style="display: block">
    <defs>
      <!-- Le dégradé ne s'éteint qu'en arrière : à partir du coureur (20 % du bas) et
           jusqu'en haut, la trace est pleine. -->
      <linearGradient id="a-trace" x1="0" y1="334" x2="0" y2="0" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#2E8BFF" stop-opacity="0"/>

        <stop offset="20%" stop-color="#2E8BFF" stop-opacity="1"/>
        <stop offset="100%" stop-color="#2E8BFF" stop-opacity="1"/>
      </linearGradient>
    </defs>

    <!-- Aucune atténuation : les voies sont blanches d'un bord à l'autre. -->
    <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
      <path d="M-12 250 L246 264" stroke-width="9.3"/>
      <path d="M-12 176 L246 148" stroke-width="8"/>
      <path d="M-12 88 L246 106" stroke-width="6.7"/>
      <path d="M145 188 L246 220" stroke-width="6.7"/>
    </g>
    <g fill="none" stroke="#000000" stroke-linecap="round">
      <path d="M-12 250 L246 264" stroke-width="5.3"/>
      <path d="M-12 176 L246 148" stroke-width="4"/>
      <path d="M-12 88 L246 106" stroke-width="2.7"/>
      <path d="M145 188 L246 220" stroke-width="2.7"/>
    </g>
    <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-width="2.2">
      <path d="M117 258 L26 306"/>
      <path d="M139 104 L48 74" stroke-dasharray="6 5"/>
      <path d="M186 -6 L206 92"/>
    </g>

    <path d="M112 342 C114 315 117 290 117 267 C117 236 138 216 145 188 C152 158 136 132 139 104 C142 68 158 46 155 -6"
          fill="none" stroke="url(#a-trace)" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- La flèche de position, en blanc, cernée de noir pour tenir sur une chaussée claire -->
    <path d="M117 246 L134 284 L117 274 L100 284 Z"
          fill="#FFFFFF" stroke="#000000" stroke-width="2.4" stroke-linejoin="round"/>

    <g opacity="0.85">
      <line x1="8" y1="322" x2="52" y2="322" stroke="#FFFFFF" stroke-width="2"/>
      <line x1="8" y1="318" x2="8" y2="326" stroke="#FFFFFF" stroke-width="2"/>
      <line x1="52" y1="318" x2="52" y2="326" stroke="#FFFFFF" stroke-width="2"/>
      <text x="8" y="314" fill="#FFFFFF" font-size="11" font-weight="700" font-family="Roboto Condensed, system-ui, sans-serif">100 m</text>
    </g>
  </svg>
</div>
