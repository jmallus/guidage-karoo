name: build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  core-tests:
    # La logique de guidage se teste sans karoo-ext : ces tests tournent toujours.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:test

  apk:
    # La construction de l'APK requiert un jeton avec read:packages pour GitHub Packages,
    # à déclarer dans les secrets du dépôt (GPR_USER / GPR_KEY).
    runs-on: ubuntu-latest
    needs: core-tests
    steps:
      - uses: actions/checkout@v4
      - id: creds
        run: echo "available=${{ secrets.GPR_KEY != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.creds.outputs.available == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - if: steps.creds.outputs.available == 'true'
        uses: gradle/actions/setup-gradle@v4
      - if: steps.creds.outputs.available == 'true'
        run: ./gradlew :app:assembleRelease
        env:
          GITHUB_ACTOR: ${{ secrets.GPR_USER }}
          GITHUB_TOKEN: ${{ secrets.GPR_KEY }}
      - if: steps.creds.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: guidage-karoo-apk
          path: app/build/outputs/apk/release/*.apk
      - if: steps.creds.outputs.available != 'true'
        run: echo "Secrets GPR_USER / GPR_KEY absents — construction de l'APK ignorée."
