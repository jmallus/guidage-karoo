name: build

on:
  push:
    branches: ["**"]
    # Un tag vX.Y publie une Release avec l'APK attaché, téléchargeable par lien direct
    # (c'est ce lien que l'app Hammerhead Companion sait envoyer vers le Karoo).
    tags: ["v*"]
  pull_request:
  # Permet de relancer la construction à la main depuis l'onglet Actions,
  # par exemple après avoir ajouté les secrets GPR_USER / GPR_KEY.
  workflow_dispatch:

jobs:
  core-tests:
    # La logique de guidage se teste sans karoo-ext : ces tests tournent toujours.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:test

  apk:
    # La construction de l'APK requiert un jeton avec read:packages pour GitHub Packages,
    # à déclarer dans les secrets du dépôt (GPR_USER / GPR_KEY).
    runs-on: ubuntu-latest
    needs: core-tests
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: creds
        run: echo "available=${{ secrets.GPR_KEY != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.creds.outputs.available == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - if: steps.creds.outputs.available == 'true'
        uses: gradle/actions/setup-gradle@v4
      - if: steps.creds.outputs.available == 'true'
        run: ./gradlew :app:assembleRelease
        env:
          GITHUB_ACTOR: ${{ secrets.GPR_USER }}
          GITHUB_TOKEN: ${{ secrets.GPR_KEY }}
      - if: steps.creds.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: guidage-karoo-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Publier la Release sur un tag
        if: steps.creds.outputs.available == 'true' && startsWith(github.ref, 'refs/tags/v')
        run: |
          cp app/build/outputs/apk/release/app-release.apk guidage-karoo.apk
          gh release create "$GITHUB_REF_NAME" guidage-karoo.apk \
            --title "Guidage $GITHUB_REF_NAME" \
            --notes "Extension de guidage d'itinéraire pour Hammerhead Karoo.

          **Installation sur le Karoo 3**, depuis votre téléphone : ouvrez cette page dans le navigateur du téléphone, appuyez longuement sur le lien \`guidage-karoo.apk\` ci-dessous, puis partagez-le vers l'application Hammerhead Companion. L'écran d'installation apparaît alors sur le Karoo.

          Une fois installée, ajoutez les champs via Profils → une page → ajouter un champ de données → Guidage."
        env:
          GH_TOKEN: ${{ github.token }}
      - if: steps.creds.outputs.available != 'true'
        run: echo "Secrets GPR_USER / GPR_KEY absents — construction de l'APK ignorée."
