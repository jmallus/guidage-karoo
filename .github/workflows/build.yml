name: build

on:
  push:
    branches: ["**"]
    # Un tag vX.Y publie une Release versionnée avec l'APK attaché.
    tags: ["v*"]
  pull_request:
  # Permet de relancer la construction à la main depuis l'onglet Actions,
  # par exemple après avoir ajouté les secrets GPR_USER / GPR_KEY.
  workflow_dispatch:

# Une poussée déclenche deux constructions — l'une pour la branche, l'autre pour la PR —
# et plusieurs poussées rapprochées les empilent. Toutes publient la même Release, ce qui
# finit par se voir : GitHub refuse la rafale d'écritures et renvoie un 403. Une seule
# construction par référence à la fois, les précédentes cédant la place.
concurrency:
  group: construction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    # La logique de guidage et l'outillage se testent sans karoo-ext ni SDK Android :
    # ces tests tournent toujours.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:test :tools:test

  apk:
    # La construction de l'APK requiert un jeton avec read:packages pour GitHub Packages,
    # à déclarer dans les secrets du dépôt (GPR_USER / GPR_KEY).
    runs-on: ubuntu-latest
    needs: core-tests
    permissions:
      contents: write
    steps:
      # Historique complet : les notes de publication se composent des changements survenus
      # depuis le tag précédent, que la copie superficielle ne contient pas.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: creds
        run: echo "available=${{ secrets.GPR_KEY != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.creds.outputs.available == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - if: steps.creds.outputs.available == 'true'
        uses: gradle/actions/setup-gradle@v4
      # Le fond de carte voyage dans l'APK : le coureur n'a ainsi rien à copier sur
      # l'appareil. Il vient de la Release « carte », fabriquée à part par le workflow
      # fond-de-carte, et n'entre jamais dans l'historique Git.
      - name: Embarquer le fond de carte
        if: steps.creds.outputs.available == 'true'
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          if gh release download carte --pattern '*.gkmap' --output app/src/main/assets/carte.gkmap --clobber; then
            ls -lh app/src/main/assets/carte.gkmap
          else
            echo "Pas de Release « carte » : l'APK sera construit sans fond de carte."
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      # Le simulateur de bureau exécute le vrai rendu du tableau de bord sous Robolectric.
      # Ses tests le tiennent droit sans fenêtre : ils vérifient que chaque portée dessine
      # bien la trace, ce qu'une simple compilation ne dirait pas — un écran noir compile
      # parfaitement. Les images produites sont attachées à la construction, ce qui donne un
      # aperçu du champ à chaque poussée sans sortir le vélo.
      - name: Contrôler le rendu du tableau de bord
        if: steps.creds.outputs.available == 'true'
        run: ./gradlew :app:testDebugUnitTest
        env:
          GITHUB_ACTOR: ${{ secrets.GPR_USER }}
          GITHUB_TOKEN: ${{ secrets.GPR_KEY }}

      # La clé de signature n'est plus dans le dépôt, qui est public : elle arrive d'un secret,
      # décodée hors de l'arbre de travail pour qu'aucune commande ultérieure ne puisse la
      # commiter par accident. Le fichier meurt avec le runner.
      - name: Poser la clé de signature
        id: cle
        if: steps.creds.outputs.available == 'true'
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::warning::Secret GUIDAGE_KEYSTORE_B64 absent — l'APK sera signé avec la clé de debug et ne sera pas publié."
            echo "signe=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/guidage.keystore"
          echo "signe=true" >> "$GITHUB_OUTPUT"
        env:
          KEYSTORE_B64: ${{ secrets.GUIDAGE_KEYSTORE_B64 }}

      - if: steps.creds.outputs.available == 'true'
        run: ./gradlew :app:assembleRelease
        env:
          GITHUB_ACTOR: ${{ secrets.GPR_USER }}
          GITHUB_TOKEN: ${{ secrets.GPR_KEY }}
          GUIDAGE_KEYSTORE: ${{ steps.cle.outputs.signe == 'true' && format('{0}/guidage.keystore', runner.temp) || '' }}
          GUIDAGE_KEYSTORE_PASSWORD: ${{ secrets.GUIDAGE_KEYSTORE_PASSWORD }}
          GUIDAGE_KEY_ALIAS: ${{ secrets.GUIDAGE_KEY_ALIAS }}
          GUIDAGE_KEY_PASSWORD: ${{ secrets.GUIDAGE_KEY_PASSWORD }}
      # Il n'y a plus d'artefact d'Actions ici. Il faisait double emploi avec la Release
      # ci-dessous — une poussée sur la branche d'une PR déclenche les deux — et gardait
      # quatre-vingt-dix jours un APK que personne ne peut installer depuis là. Au bout de
      # cent trente constructions le quota de stockage du compte était plein, et l'envoi
      # échouait : la PR passait au rouge alors que la compilation, elle, réussissait.

      # Un artefact d'Actions n'est téléchargeable que connecté, et sous forme d'archive :
      # l'app Hammerhead Companion ne peut pas l'envoyer au Karoo. Une Release, si —
      # elle expose un lien direct vers le .apk.
      - name: Publier l'APK en Release
        if: >-
          steps.creds.outputs.available == 'true' && github.event_name != 'pull_request'
          && steps.cle.outputs.signe == 'true'
        run: |
          cp app/build/outputs/apk/release/app-release.apk guidage-karoo.apk
          # Le même nom de version que celui compilé dans l'APK (voir app/build.gradle.kts).
          # Le recalculer ici est une duplication assumée : le lire depuis l'APK demanderait
          # aapt, et quelques lignes de shell coûtent moins qu'un outil de plus dans le job.
          # Le garde-fou du côté Gradle — un chiffre exigé après le « v », pour que les tags
          # « latest » et « carte » ne nomment pas une version — est inutile ici : ce
          # workflow ne se déclenche que sur les tags « v* ».
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="1.0.${GITHUB_RUN_NUMBER}"
          fi
          # Le numéro de version et le commit sont portés dans les notes : la ligne
          # « Commit » affichée en tête de la page GitHub, elle, est celle de la création de
          # la Release et ne bouge plus jamais, ce qui laisse croire que l'APK date de là.
          cat > notes.md <<NOTES
          Version **${version}**, construite le $(date -u '+%d/%m/%Y à %H:%M UTC')
          à partir de \`${GITHUB_SHA:0:7}\`. Fond de carte embarqué : \`$(
            [ -f app/src/main/assets/carte.gkmap ] &&
              du -h app/src/main/assets/carte.gkmap | cut -f1 || echo aucun
          )\`.

          Extension de guidage d'itinéraire pour Hammerhead Karoo — profil à venir,
          prochaine côte, prochain point d'intérêt et annonces in-ride.

          **Installation sur le Karoo 3**, depuis le téléphone : ouvrir cette page dans le
          navigateur du téléphone, appuyer longuement sur le lien \`guidage-karoo.apk\`
          ci-dessous, puis le partager vers l'application Hammerhead Companion.
          L'écran d'installation s'affiche ensuite sur le Karoo.

          Une fois installée : Profils → une page → ajouter un champ de données →
          extension **Guidage** → champ **Tableau de bord**.

          ---

          Fond de carte : données © les contributeurs [OpenStreetMap](https://www.openstreetmap.org/copyright),
          sous licence [ODbL](https://opendatacommons.org/licenses/odbl/1-0/).
          Extraits régionaux [Geofabrik](https://download.geofabrik.de).
          NOTES
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # Le manifeste que Karoo OS interroge pour proposer « Mise à jour » sur la fiche
            # de l'extension. Il n'accompagne que les Releases taguées : « releases/latest »
            # désigne la dernière Release non préliminaire, et le Karoo ne doit voir que les
            # versions publiées à dessein, pas chaque poussée sur main.
            #
            # Les changements sont pris en premier parent : les commits internes aux pull
            # requests répéteraient chacun le titre de leur fusion, et les régénérations de
            # captures n'apprennent rien à qui roule.
            precedent=$(git describe --tags --abbrev=0 --match 'v[0-9]*' \
              "${GITHUB_REF_NAME}^" 2>/dev/null || true)
            if [ -n "$precedent" ]; then
              changements=$(git log --first-parent --format='· %s' \
                "${precedent}..${GITHUB_REF_NAME}" \
                | grep -v 'Régénère les captures' | head -12 || true)
            fi
            [ -n "${changements:-}" ] || changements="Première version publiée."

            # Les captures du simulateur illustrent la fiche sur l'appareil. Trois, nommées
            # une à une : le tableau de bord, l'autonomie, les virages. Prendre tous les
            # champs faisait une planche-contact où le premier coup d'œil ne retenait rien —
            # ces trois-là disent ce que l'extension apporte, et le tableau de bord d'abord,
            # puisque c'est par lui qu'on commence.
            #
            # Les URL sont figées sur le commit du tag, jamais sur main : une capture
            # renommée plus tard laisserait sinon une image morte dans une Release déjà
            # publiée. Une capture manquante est sautée plutôt que de produire un lien mort.
            captures=$(
              for f in docs/captures/carte-300m.png \
                       docs/captures/champ-autonomie.png \
                       docs/captures/champ-virages.png; do
                [ -e "$f" ] || continue
                echo "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/${f}"
              done | jq -R . | jq -s .
            )

            # jq compose le JSON : les notes contiennent des retours à la ligne et des
            # apostrophes, qu'un assemblage à la main casserait tôt ou tard.
            jq -n \
              --argjson captures "$captures" \
              --arg label "Guidage" \
              --arg paquet "io.github.jmallus.guidage" \
              --arg apk "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/guidage-karoo.apk" \
              --arg version "$version" \
              --argjson code "$(( 1 + GITHUB_RUN_NUMBER ))" \
              --arg dev "jmallus" \
              --arg desc "Guidage d'itinéraire hors ligne pour Karoo : profil à venir, prochaine côte, ruban de courbure, revêtement, réserve d'eau et budget d'effort. Fond de carte embarqué, aucun accès réseau." \
              --arg notes "$changements" \
              '{label: $label, packageName: $paquet, latestApkUrl: $apk,
                latestVersion: $version, latestVersionCode: $code,
                developer: $dev, description: $desc, releaseNotes: $notes,
                screenshotUrls: $captures}' \
              > manifest.json
            cat manifest.json

            gh release create "$GITHUB_REF_NAME" guidage-karoo.apk manifest.json \
              --title "Guidage $GITHUB_REF_NAME" --notes-file notes.md \
              || gh release upload "$GITHUB_REF_NAME" guidage-karoo.apk manifest.json --clobber
          else
            # Release « latest » mise à jour en place : le lien ne change jamais, et on
            # évite le couple supprimer/recréer, qui détruisait le lien le temps de la
            # reconstruction et doublait les écritures.
            if gh release view latest >/dev/null 2>&1; then
              gh release upload latest guidage-karoo.apk --clobber
              gh release edit latest --notes-file notes.md --target "$GITHUB_SHA"
            else
              gh release create latest guidage-karoo.apk \
                --target "$GITHUB_SHA" --prerelease \
                --title "Guidage — dernière construction" --notes-file notes.md
            fi
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - if: steps.creds.outputs.available != 'true'
        run: echo "Secrets GPR_USER / GPR_KEY absents — construction de l'APK ignorée."
