name: captures

# Range dans docs/captures/ les images que le simulateur produit, et les commite.
#
# Elles remplacent les planches, qui étaient une seconde écriture de l'affichage en
# JavaScript et dérivaient du code à chaque changement. Celles-ci sortent du rendu de
# l'appareil, sous Robolectric : elles ne peuvent pas mentir sur ce que le champ dessine.
#
# Il part tout seul quand le rendu change, et pas autrement : les chemins surveillés sont
# ceux qui décident de ce qu'on voit — les rendus, les constructeurs de modèle, les libellés,
# le parcours d'aperçu et le simulateur lui-même. Un changement dans `core/` ou dans le
# convertisseur de cartes ne déplace aucun pixel et ne déclenche donc rien.
#
# Le travail est de toute façon sans effet quand rien n'a bougé : les images sont comparées
# à celles du dépôt, et le job s'arrête sans commiter si elles sont identiques.
on:
  push:
    branches: [main]
    paths:
      - "app/src/main/kotlin/io/github/jmallus/guidage/ui/**"
      - "app/src/main/kotlin/io/github/jmallus/guidage/extension/*Models.kt"
      - "app/src/main/res/values*/strings.xml"
      - "app/src/test/kotlin/io/github/jmallus/guidage/sim/**"
      - ".github/workflows/captures.yml"
  workflow_dispatch:

concurrency:
  group: captures
  cancel-in-progress: true

jobs:
  captures:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - id: creds
        run: echo "available=${{ secrets.GPR_KEY != '' }}" >> "$GITHUB_OUTPUT"

      - if: steps.creds.outputs.available != 'true'
        run: |
          echo "::error::Secrets GPR_USER / GPR_KEY absents — :app ne peut pas se compiler."
          exit 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Le fond de carte n'est pas nécessaire : le simulateur engendre son propre décor.
      # C'est même préférable — les captures ne dépendent alors que du code.
      - name: Rendre les captures
        run: ./gradlew :app:testDebugUnitTest --console=plain
        env:
          GITHUB_ACTOR: ${{ secrets.GPR_USER }}
          GITHUB_TOKEN: ${{ secrets.GPR_KEY }}
          # Les heures écrites sur les captures — arrivée, coucher — sont celles du fuseau de
          # la machine, et l'exécuteur vit à Greenwich : le coucher de Grenoble s'y lisait
          # « 17:57 ». Le coureur simulé, lui, est en France.
          TZ: Europe/Paris

      - name: Ranger et commiter
        run: |
          set -euo pipefail
          # docs/captures/ doit rester versionné : le .gitignore d'Android Studio porte un
          # « captures/ » sans barre oblique, qui attrapait ce dossier-ci par ricochet et
          # faisait échouer le « git add » sans que rien n'ait mal tourné avant.
          mkdir -p docs/captures
          # Le dossier est vidé plutôt que recouvert : une capture dont le champ a disparu
          # doit disparaître avec lui, sinon le README montrerait un champ qui n'existe plus.
          rm -f docs/captures/*.png
          cp app/build/simulateur/*.png docs/captures/
          ls -lh docs/captures/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/captures
          if git diff --cached --quiet; then
            echo "Les captures n'ont pas changé."
            exit 0
          fi
          # « [skip ci] » évite de relancer la construction de l'APK : ces images ne
          # partent pas dedans, et republier une Release pour un PNG serait du gâchis.
          git commit -m "Régénère les captures du simulateur [skip ci]" \
            -m "Rendues par le code de l'appareil sous Robolectric, à partir de $GITHUB_SHA."
          git push origin HEAD:main
